services:
  - type: web
    name: psipav
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn psipav.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: PSIPAV_SENHA
        sync: false
